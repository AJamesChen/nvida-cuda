name: CUDA CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Show CUDA environment
        run: |
          nvidia-smi
          nvcc --version

      - name: Build all CUDA exercises
        run: |
          for dir in gpcc-*; do
            if [ -f "$dir/Makefile" ]; then
              echo "Building $dir"
              make -C "$dir" clean || true
              make -C "$dir"
            fi
          done

      - name: Run Python tests
        run: |
          python3 -m pytest \
            gpcc-ex4-1-primality/tests \
            gpcc-ex4-2-multiply-array/tests \
            gpcc-ex4-3-vector-operation/tests \
            gpcc-ex4-4-array-power-sqrt/tests