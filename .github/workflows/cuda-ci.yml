name: CUDA CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: self-hosted

    env:
      PATH: /usr/local/cuda-12.3/bin:${{ env.PATH }}
      LD_LIBRARY_PATH: /usr/local/cuda-12.3/lib64:${{ env.LD_LIBRARY_PATH }}

    strategy:
      fail-fast: false
      matrix:
        exercise:
          - gpcc-ex4-1-primality
          - gpcc-ex4-2-multiply-array
          - gpcc-ex4-3-vector-operation
          - gpcc-ex4-4-array-power-sqrt

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          echo "PWD=$PWD"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la

      - name: Check NVIDIA GPU
        run: nvidia-smi

      - name: Check CUDA compiler
        run: nvcc --version

      - name: Build ${{ matrix.exercise }}
        working-directory: ${{ matrix.exercise }}
        run: make clean && make

      - name: Run Python tests
        working-directory: ${{ matrix.exercise }}
        run: |
          python3 -m pip install --user pytest
          python3 -m pytest tests -v